<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritim">
<title>Ritim · Spor ve Alışkanlık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, net, koç gibi destekleyen; suçlamayan dil ("iki gün üst üste kaçırma")
   IDEA: kişisel antrenör + alışkanlık defteri — uygulama doğrudan bugünün antrenmanıyla açılır
   PICTURE: her harekette çalışan çizgi figür animasyonu; Bugün kartında bugünün ilk hareketi oynar
   COLOUR and TYPE: kırık beyaz / grafit zemin, elektrik mavisi tek vurgu, seri için mercan; Plus Jakarta Sans
   LAYOUT: tek sütun, 20px kart yarıçapı, 48px dokunma, yüzen cam alt menü */
:root{color-scheme:light dark;
--bg:light-dark(#f4f4f2,#08090a);--card:light-dark(#ffffff,#111214);--card2:light-dark(#ecece9,#1a1b1e);--ink:light-dark(#0e0f11,#f4f4f3);--ink2:light-dark(#3d3f44,#c2c4c9);--mute:light-dark(#6a6d73,#85888f);--line:light-dark(#e2e2de,#1f2024);--track:light-dark(#e6e6e2,#1c1d21);
--acc:light-dark(#0e0f11,#f4f4f3);--accs:light-dark(rgba(14,15,17,.06),rgba(255,255,255,.06));--acci:light-dark(#ffffff,#08090a);
--fig:light-dark(#2b2d32,#d9dce2);--hot:light-dark(#d9482b,#ff7a59);--ok:light-dark(#11894a,#2ee59d);--water:light-dark(#0b7fb8,#5cc8f2);--sleep:light-dark(#5b45c4,#a99bff);--mood:light-dark(#b06e05,#f6c344);
--g:light-dark(#11a35a,#2ee59d);--y:light-dark(#c98a06,#f6c344);--rd:light-dark(#d9482b,#ff5a5f);
--sh:none;--r:20px;--r2:14px;--h:48px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.eyebrow{font-size:13px;color:var(--mute);font-weight:600}
.h1{font-size:30px}
.h2{font-size:21px;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
.h2 .lk{margin-left:auto;font-size:14px;font-weight:700;color:var(--acc);min-height:44px;padding:0 4px}
.sub{color:var(--ink2);font-size:15px;margin:6px 0 0}
.muted{color:var(--mute)}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--acci);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.av.lg{width:84px;height:84px;font-size:34px}
.btn{min-height:var(--h);padding:0 20px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acci)}
.btn.soft{background:var(--accs);border-color:transparent;color:var(--acc)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--hot)}
.btn.w{width:100%}.btn.lg{min-height:56px;font-size:17px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.pill .ic{width:16px;height:16px}
.pill.hot{background:color-mix(in srgb,var(--hot) 14%,transparent);color:var(--hot)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:grid;gap:6px;font-size:14px;color:var(--ink2);font-weight:600}
input,select,textarea{font-size:16px;min-height:52px;padding:12px 16px;border-radius:var(--r2);border:1px solid var(--line);background:var(--card);width:100%}
textarea{min-height:150px;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
form.f{display:grid;gap:14px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.note{font-size:13px;color:var(--mute);margin:12px 2px 0}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .t{flex:1}.li .t b{display:block;font-weight:700}.li .t small{display:block;color:var(--mute);font-size:13px}
.li .n{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.icb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none}
.del{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mute);flex:none}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 13%,transparent)}
/* ana sayfa */
.hd{display:flex;align-items:center;gap:10px;min-height:48px}
.hd .hi{font-size:17px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.av.sm2{width:38px;height:38px;font-size:15px;background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.hero2{margin-top:18px;padding:22px 18px 18px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.ringbox{display:grid;place-items:center}.bring{width:200px;height:200px}
.hcap{text-align:center;margin-top:4px}.hcap b{display:block;font-size:17px}.hcap span{font-size:13px;color:var(--mute);font-weight:600}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.met{text-align:left;padding:2px 10px;border-left:1px solid var(--line);min-height:56px}.met:first-child{border-left:0;padding-left:2px}
.met small{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.met b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.met em{display:block;font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weekb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px;padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.wb{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:72px;padding:0}
.wbt{width:8px;height:44px;border-radius:9px;background:var(--track);display:flex;align-items:flex-end;overflow:hidden}.wbt i{display:block;width:100%;border-radius:9px}
.wb small{font-size:11px;font-weight:700;color:var(--mute)}.wb.sel small{color:var(--ink)}.wb.sel .wbt{outline:1.5px solid var(--ink);outline-offset:2px}
.wb:disabled{opacity:.4}
.sect{margin-top:14px}
.row2{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:left}
.row2 .thumb{width:64px;height:64px;border-radius:14px;background:var(--card2);flex:none;overflow:hidden}.row2 .thumb svg{width:64px;height:64px}
.row2 .t{flex:1}.row2 small{display:block;font-size:12px;font-weight:700;color:var(--mute)}.row2 b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}.row2 em{display:block;font-style:normal;font-size:13px;color:var(--mute)}
.playb{width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--acci);display:grid;place-items:center;flex:none}.playb.ghost{background:var(--card2);color:var(--ink)}
.h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:28px 4px 10px;display:flex;align-items:center;gap:8px}
.h3 .cnt{color:var(--ink)}.h3 .lk{margin-left:auto;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:700;min-height:44px}
.list{border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:60px;border-top:1px solid var(--line);text-align:left}.lrow:first-child{border-top:0}
.lrow .lic{color:var(--mute);display:grid;place-items:center}.lrow .lic .ic{width:20px;height:20px}
.lrow .t{flex:1}.lrow b{display:block;font-weight:600;font-size:16px}.lrow small{font-size:12px;color:var(--mute);font-weight:600}
.lrow.done b{color:var(--mute)}
.lrow .val{font-weight:700;font-size:15px}.lrow .chev{width:18px;height:18px;color:var(--mute)}
.ck2{width:44px;height:44px;display:grid;place-items:center;flex:none;margin-right:-8px}
.ck2 .ic{width:28px;height:28px;padding:5px;border-radius:50%;border:1.5px solid var(--mute);color:transparent;box-sizing:border-box;transition:.15s}.ck2.on .ic{background:var(--g);border-color:var(--g);color:#08090a}
.chipsx{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}.tchip .ic{width:18px;height:18px;color:var(--mute)}
.tipx{font-size:13px;color:var(--mute);margin:22px 4px 0;line-height:1.5}
/* modül görselleri */
.watr{display:flex;gap:18px;align-items:center;padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.bottle{width:120px;height:auto;flex:none}
.wtx b{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}.wtx b span{font-size:20px;color:var(--mute)}
.wtx small{display:block;color:var(--mute);font-weight:600;margin-top:4px}.wtx p{margin:12px 0 10px;color:var(--ink2);font-size:15px}
.dial{width:100%;max-width:280px;height:auto}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.mcal small{text-align:center;font-size:11px;font-weight:700;color:var(--mute)}
.mcal button,.mcal i{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--card2);padding:0}.mcal i{background:none}
.mcal button.sel{outline:2px solid var(--ink);outline-offset:1px}.mcal button:disabled{opacity:.3}
body:has(#sheet.open) #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
/* oda */
.roomcard{margin-top:14px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#1a1c22,#0b0c0e);border:1px solid var(--line);padding:10px 0 12px}
.room{width:100%;height:auto;display:block}
.room g[data-act]:active{opacity:.85}
.rcap{text-align:center;font-size:12px;color:#8a8d93;font-weight:600;margin-top:2px}
.coll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ci{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center;color:var(--mute)}
.ci span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2)}
.ci b{font-size:12px;font-weight:700;line-height:1.2}
.ci.on{color:var(--ink)}.ci.on span{background:color-mix(in srgb,var(--g) 18%,transparent);color:var(--g)}
.mini{display:block;width:70%;height:4px;border-radius:9px;background:var(--track);overflow:hidden}.mini i{display:block;height:100%;background:var(--g)}
.closeup{width:100%;height:auto;display:block;border-radius:20px}
/* kütüphane */
.lstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lstat div{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.lstat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.lstat b span{font-size:15px;color:var(--mute)}
.lstat small{font-size:12px;color:var(--mute);font-weight:600}
.reading{display:grid;gap:10px}
.rcard{display:flex;gap:14px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.rcard .t{flex:1}.rcard b{display:block;font-size:17px;font-weight:800;line-height:1.25}.rcard small{color:var(--mute);font-size:13px}
.cvb{padding:0;flex:none}
.cover{width:92px;height:136px;border-radius:3px 8px 8px 3px;padding:12px 10px 10px 16px;color:#f2e8d2;background:linear-gradient(90deg,rgba(0,0,0,.38) 0 6px,rgba(255,255,255,.1) 6px 8px,transparent 8px),linear-gradient(160deg,rgba(255,255,255,.12),transparent 40%),var(--c);box-shadow:0 10px 22px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;flex:none;text-align:left}
.cover b{font-family:Georgia,'Times New Roman',serif;font-size:13px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover small{font-size:10px;opacity:.85;color:#f2e8d2!important}
.cover.big{width:112px;height:166px}.cover.big b{font-size:15px}
.quote{margin:14px 0 0;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.quote blockquote{margin:0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:18px;line-height:1.45}
.quote figcaption{margin-top:10px;font-size:13px;color:var(--mute);font-weight:600}
.case{padding:18px 12px 4px;border-radius:20px;background:linear-gradient(180deg,light-dark(#efe9e1,#15120f),light-dark(#e6ded3,#100e0c));border:1px solid var(--line)}
.shelf{margin-bottom:16px}
.books{display:flex;align-items:flex-end;gap:3px;padding:0 8px;min-height:120px}
.plank{height:12px;border-radius:3px;background:linear-gradient(180deg,#5a4532,#3a2c1f);box-shadow:0 8px 12px -4px rgba(0,0,0,.55)}
.spine{flex:none;border-radius:3px 3px 1px 1px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;color:#ece2cb;background:linear-gradient(90deg,rgba(0,0,0,.32),transparent 22%,rgba(255,255,255,.1) 50%,transparent 78%,rgba(0,0,0,.36)),var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);transition:transform .15s}
.spine:active{transform:translateY(-6px)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 0;line-height:1}
.spine .band{display:block;width:70%;height:2px;background:rgba(236,226,203,.5);margin:2px 0}.spine .band.b2{margin-top:2px}
.spine em{font-style:normal;font-size:9px;letter-spacing:-1px;color:#f6c344;line-height:1}
.books.ghost{position:relative}.books.ghost i{display:block;border-radius:3px;border:1.5px dashed var(--line);flex:none}
.books.ghost span{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:13px;color:var(--mute);font-weight:600;white-space:nowrap;background:var(--card);padding:6px 12px;border-radius:99px;border:1px solid var(--line)}
.sh h2.h3{font-size:13px;margin:20px 4px 8px}
.cover b{overflow-wrap:anywhere;hyphens:auto}
.stars{display:flex;gap:2px;margin-top:8px}.stars button{width:40px;height:40px;display:grid;place-items:center;color:var(--line)}.stars button.on{color:var(--y)}.stars button.on .ic{fill:currentColor}
/* giriş */
.auth{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;gap:22px;padding-top:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--acc);display:grid;place-items:center;color:var(--acci)}
.hero-fig{border-radius:28px;background:var(--accs);display:grid;place-items:center;aspect-ratio:1.25;overflow:hidden}
.hero-fig svg{width:78%;height:auto}
.auth h1{font-size:38px;line-height:1.05}
.prof{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);text-align:left;margin-top:10px;min-height:72px}
.prof .t{flex:1}.prof b{display:block;font-weight:800;font-size:17px}.prof small{color:var(--mute);font-size:13px}
.pin{display:flex;justify-content:center;gap:14px;margin:18px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink2)}.pin i.on{background:var(--ink);border-color:var(--ink)}
.pad3{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad3 button{width:72px;height:72px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:26px;font-weight:700}
.pad3 button:active{background:var(--card2)}
.step{display:flex;gap:6px;margin-bottom:6px}.step i{flex:1;height:4px;border-radius:9px;background:var(--line)}.step i.on{background:var(--acc)}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);text-align:left;margin-top:10px;min-height:68px}
.opt.on{border-color:var(--acc);background:var(--accs)}
.opt b{display:block;font-weight:800}.opt small{color:var(--mute);font-size:13px}
.opt .rd{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);margin-left:auto;flex:none;display:grid;place-items:center}
.opt.on .rd{border-color:var(--acc);background:var(--acc);color:var(--acci)}.opt .rd .ic{width:14px;height:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--card2)}
.seg button{min-height:42px;border-radius:12px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* bugün */
.top{display:flex;align-items:center;gap:12px;min-height:52px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:16px;min-height:66px}
.wd small{font-size:12px;color:var(--mute);font-weight:700}
.wd span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--card2) 0)}
.wd span b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
.wd.sel span b{background:var(--acc);color:var(--acci)}
.wd:disabled{opacity:.35}
.wo{margin-top:18px;overflow:hidden}
.wo .fig{background:var(--accs);display:grid;place-items:center;height:230px;position:relative}
.wo .fig svg{height:210px;width:auto}
.wo .tag{position:absolute;left:14px;top:14px;padding:5px 11px;border-radius:99px;background:var(--card);font-size:12px;font-weight:800}
.wo h2{font-size:24px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hab{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:68px;border-top:1px solid var(--line)}

const habDue=(h,k)=>(!h.days||h.days.includes(kd(k).getDay()))&&(h.created||'0')<=k;
function habDone(h,k){const d=peek(k);switch(h.kind){case'water':return d.water>=wG(k);case'journal':return !!d.journal;case'breath':return d.breath>=5;case'pages':return (d.pages||0)>=10||!!d.h[h.id];case'protein':return d.meals.reduce((a,m)=>a+(+m.p||0),0)>=S.goals.protein&&!!d.meals.length||!!d.h[h.id];default:return !!d.h[h.id]}}
function habStreak(h){let k=TODAY(),n=0,miss=0;if(!habDone(h,k))k=addD(k,-1);

for(const w of S.workouts){const v=50+(w.prs||0)*20;o.prs+=w.prs||0;o.per[w.k]=(o.per[w.k]||0)+v;o.xp+=v}

o.lv=levelOf(o.xp);o.level=o.lv.L;return o}

function cycInfo(){const st=[...S.cycle.starts].sort();if(!st.length)return null;const diffs=st.slice(1).map((s,i)=>Math.round((kd(s)-kd(st[i]))/864e5)).filter(d=>d>15&&d<60);const len=diffs.length?Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length):S.cycle.len;const last=st[st.length-1];const dayN=Math.round((kd(TODAY())-kd(last))/864e5)+1;const next=addD(last,len);return{len,last,dayN,next,inN:Math.round((kd(next)-kd(TODAY()))/864e5)}}

ruya(){const d=peek(UI.date).dream||{t:'',emo:null,clear:2,tags:[],lucid:false};const all=Object.entries(S.days).filter(([,x])=>x.dream&&x.dream.t).sort((a,b)=>b[0].localeCompare(a[0]));const tc={};all.forEach(([,x])=>x.dream.tags.forEach(t=>tc[t]=(tc[t]||0)+1));const top=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,4);

${top.length?`<h2 class="h2">En sık temaların</h2><div class="chips" style="flex-wrap:wrap">${top.map(([t,n])=>`<span class="pill">${esc(t)} · ${n}</span>`).join('')}</div>`:''}
<h2 class="h2">Önceki rüyalar <span class="pill">${all.length}</span></h2><div class="card" style="padding:4px 16px">${all.filter(([k])=>k!==UI.date).slice(0,8).map(([k,x])=>`<div class="li"><div class="t"><b>${fdate(k)}${x.dream.lucid?' · berrak':''}${x.dream.emo!=null?' · '+DEMO[x.dream.emo]:''}</b><small>${esc(x.dream.t.slice(0,120))}${x.dream.t.length>120?'…':''}</small></div></div>`).join('')||'<p class="muted">Henüz yok.</p>'}</div>`},

<label class="btn pri lg w" style="margin-top:16px;cursor:pointer">${ic('cam')} ${pose} fotoğraf ekle<input type="file" accept="image/*" data-photo style="position:absolute;opacity:0;width:1px;height:1px"></label>

const RK=17,RCX=180,RCY=128;
const RP=(x,y,z)=>[RCX+(x-y)*RK*.866,RCY+(x+y)*RK*.5-z*RK];
const pp=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a>0?v+(255-v)*a:v*(1+a))));return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function bx(x,y,z,w,d,h,c,o={}){const t=[RP(x,y,z+h),RP(x+w,y,z+h),RP(x+w,y+d,z+h),RP(x,y+d,z+h)],l=[RP(x,y+d,z),RP(x+w,y+d,z),RP(x+w,y+d,z+h),RP(x,y+d,z+h)],r=[RP(x+w,y,z),RP(x+w,y+d,z),RP(x+w,y+d,z+h),RP(x+w,y,z+h)];
return `<polygon points="${pp(t)}" fill="${o.t||shade(c,.16)}"/><polygon points="${pp(l)}" fill="${o.l||c}"/><polygon points="${pp(r)}" fill="${o.r||shade(c,-.25)}"/>`}

TV.odak=function(){const p=S.pomo,focus=p.mode==='focus',dur=(focus?S.goals.pomo:Math.round(S.goals.pomo/5))*60,rem=p.end?(p.end-Date.now())/1000:(p.rem??dur),pr=Math.max(0,Math.min(1,1-rem/dur)),d=peek(TODAY()),FL=S.focusLog||[],ks=last7(TODAY()),mins=ks.map(k=>sum(FL.filter(f=>f.k===k),f=>f.min)||(peek(k).pomo||0)*S.goals.pomo);
const hrs=Array(24).fill(0);FL.forEach(f=>hrs[+f.t.slice(0,2)]++);const bh=hrs.indexOf(Math.max(...hrs));let st=0,kk=TODAY();if(!(peek(kk).pomo>0))kk=addD(kk,-1);while(peek(kk).pomo>0&&st<999){st++;kk=addD(kk,-1)}

${p.end&&focus?`<p class="note" style="text-align:center">Dikkatin dağılınca ${ic('bolt')} tuşuna dokun. Bugün ${d.dist||0} kez.</p>`:''}

const FST=[[0,'Sindirim','Son öğününü sindiriyorsun.'],[4,'Dengelenme','Kan şekerin yavaş yavaş dengeleniyor.'],[12,'Yağ kullanımı','Vücut genel olarak depolanmış yağı daha çok kullanmaya başlar.'],[16,'Hedef bölgesi','16 saat çoğu aralıklı oruç planının hedefidir.'],[18,'Uzun oruç','Su içmeyi unutma, kendini kötü hissedersen bitir.']];
function fastClock(a,g){const R=92,cx=120,cy=120,ang=m=>(m/1440)*2*Math.PI-Math.PI/2,pt=(m,r)=>[cx+Math.cos(ang(m))*r,cy+Math.sin(ang(m))*r],now=new Date(),nm=now.getHours()*60+now.getMinutes();let arc='',el=0;
if(a){const s=new Date(a),sm=s.getHours()*60+s.getMinutes();el=(Date.now()-a)/60000;const gEnd=sm+g*60,draw=(m1,m2,c,w,o)=>{const span=Math.min(1439.9,m2-m1);if(span<=0)return'';const[x1,y1]=pt(m1,R),[x2,y2]=pt(m1+span,R);return `<path d="M${x1} ${y1} A${R} ${R} 0 ${span>720?1:0} 1 ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`};
arc=draw(sm,gEnd,'var(--hot)',16,.25)+draw(sm,sm+Math.min(el,1439),'var(--hot)',16,1);const[ex,ey]=pt(gEnd%1440,R);arc+=`<circle cx="${ex}" cy="${ey}" r="6" fill="var(--g)"/>`}
let t='';for(let h=0;h<24;h+=3){const[x,y]=pt(h*60,R+22);t+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--mute)">${pad(h)}</text>`}
const[nx,ny]=pt(nm,R);return `<svg viewBox="0 0 240 240" class="fclk"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--track)" stroke-width="16"/>${t}${arc}<circle cx="${nx}" cy="${ny}" r="9" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/><text x="120" y="112" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)" id="fT">${a?hm(el):g+':'+(24-g)}</text><text x="120" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="var(--mute)">${a?(el>=g*60?'Hedefe ulaştın':hm(g*60-el)+' kaldı'):'Hazır'}</text></svg>`}
TV.oruc=function(){const a=S.fast.active,g=S.goals.fast,el=a?(Date.now()-a)/36e5:0,L=S.fast.log,ks=last7(TODAY());
let st=0;for(let i=L.length-1;i>=0;i--){if((L[i].end-L[i].start)/36e5>=g)st++;else break}
const cur=FST.reduce((c,s,i)=>el>=s[0]?i:c,0);
return tHead('Aralıklı oruç')+`<div class="list pad" style="display:grid;place-items:center">${fastClock(a,g)}</div>
<button class="btn pri lg w" style="margin-top:12px" data-act="fast">${a?'Orucu bitir':'Orucu başlat'}</button>
${a?`<form class="f row" data-form="fastEdit" style="margin-top:10px;gap:8px"><label class="sp" style="margin:0">Başlangıç saati<input type="time" name="t" value="${pad(new Date(a).getHours())}:${pad(new Date(a).getMinutes())}"></label><button class="btn ghost" style="align-self:flex-end">Düzelt</button></form>`:''}
<div class="seg" style="margin-top:12px">${[14,16,18,20].map(h=>`<button class="${g===h?'on':''}" data-act="fastLen" data-v="${h}">${h}:${24-h}</button>`).join('')}</div>
<h2 class="h3">Vücudunda neler oluyor?</h2><div class="stages">${FST.map((s,i)=>`<div class="stg ${a&&i===cur?'on':a&&i<cur?'done':''}"><i></i><div><b>${s[0]}+ sa · ${s[1]}</b><small>${s[2]}</small></div></div>`).join('')}</div><p class="note">Saatler genel bilgidir, kişiden kişiye değişir. Sağlık durumun, hamileliğin ya da yeme bozukluğu geçmişin varsa oruca başlamadan önce doktoruna danış.</p>
<div class="fst" style="margin-top:14px"><div><small>Seri</small><b>${st}</b></div><div><small>Toplam</small><b>${L.length}</b></div><div><small>En uzun</small><b>${L.length?Math.floor(Math.max(...L.map(x=>(x.end-x.start)/36e5))):0} sa</b></div></div>
<h2 class="h3">Son oruçlar</h2><div class="list">${L.slice(-6).reverse().map(f=>{const h=(f.end-f.start)/36e5;return `<div class="lrow"><span class="lic" style="color:${h>=g?'var(--g)':'var(--mute)'}">${ic(h>=g?'check':'fast')}</span><div class="t"><b>${new Date(f.end).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</b><small>${h>=g?'Hedef tamam':'Hedefin altında'}</small></div><span class="val">${hm((f.end-f.start)/60000)}</span></div>`}).join('')||'<div class="lrow"><div class="t muted">Henüz kayıt yok.</div></div>'}</div>`};

function plate(p,pp){const R=84,C=2*Math.PI*R,o=Math.min(1,p),q=Math.min(1,pp);return `<svg viewBox="0 0 220 220" class="plate"><circle cx="110" cy="110" r="104" fill="var(--card2)"/><circle cx="110" cy="110" r="96" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/><circle cx="110" cy="110" r="${R}" fill="none" stroke="var(--track)" stroke-width="16"/><circle cx="110" cy="110" r="${R}" fill="none" stroke="${p>1.1?'var(--rd)':'var(--ok)'}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C*o} ${C}" transform="rotate(-90 110 110)" style="transition:stroke-dasharray .8s"/><circle cx="110" cy="110" r="${R-22}" fill="none" stroke="var(--track)" stroke-width="10"/><circle cx="110" cy="110" r="${R-22}" fill="none" stroke="var(--mood)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${2*Math.PI*(R-22)*q} ${C}" transform="rotate(-90 110 110)" style="transition:stroke-dasharray .8s"/></svg>`}

function scaleSvg(kg){const a=kg?((kg%10)/10)*180-90:-90;let tk='';for(let i=0;i<=10;i++){const r=(-180+i*18)*Math.PI/180,x1=110+Math.cos(r)*60,y1=98+Math.sin(r)*60,x2=110+Math.cos(r)*(i%5?53:48),y2=98+Math.sin(r)*(i%5?53:48);tk+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--mute)" stroke-width="${i%5?1.5:2.5}"/>`}return `<svg viewBox="0 0 220 150" class="scl"><rect x="10" y="14" width="200" height="130" rx="28" fill="var(--card2)" stroke="var(--line)"/>${tk}<g style="transform:rotate(${a.toFixed(1)}deg);transform-origin:110px 98px;transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)"><line x1="110" y1="98" x2="110" y2="44" stroke="var(--hot)" stroke-width="4" stroke-linecap="round"/></g><circle cx="110" cy="98" r="7" fill="var(--ink)"/><text x="110" y="134" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${kg?nf(kg,1)+' kg':'—'}</text></svg>`}

let chart='';if(pts.length>1){const vs=pts.map(x=>x.kg).concat(gl?[gl]:[]),mn=Math.min(...vs)-1,mx=Math.max(...vs)+1,X=i=>12+i*(296/(pts.length-1)),Y=x=>130-(x-mn)/(mx-mn)*116;chart=`<svg viewBox="0 0 320 140" style="width:100%;height:auto">${gl?`<line x1="0" x2="320" y1="${Y(gl)}" y2="${Y(gl)}" stroke="var(--g)" stroke-dasharray="5 5" opacity=".7"/><text x="316" y="${Y(gl)-5}" text-anchor="end" font-size="10" fill="var(--g)" font-weight="700">hedef ${nf(gl,1)}</text>`:''}<path d="${pts.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.kg).toFixed(1)).join('')}" fill="none" stroke="var(--mute)" stroke-width="1.5" opacity=".6"/><path d="${avg.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)).join('')}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.kg)}" r="2.5" fill="var(--mute)"/>`).join('')}</svg>`}

const top=Object.entries(L).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]),all=['Göğüs','Sırt','Omuz','Pazı','Arka kol','Karın','Bel','Ön bacak','Arka bacak','Kalça','Baldır'],miss=all.filter(m=>!L[m]);

function finish(){const L=S.live;let sets=0,vol=0;L.prList=[];L.items.forEach((it,i)=>{const ok=L.log[i].filter(s=>s.ok);sets+=ok.length;ok.forEach(s=>vol+=(+s.r||0)*(+s.kg||0));if(!ok.length)return;const x=EX[it.e],old=S.pr[it.e];let best;if(ok.some(s=>+s.kg>0)){best=ok.reduce((a,s)=>(+s.kg>a.kg||(+s.kg===a.kg&&+s.r>a.r))?{kg:+s.kg,r:+s.r}:a,{kg:0,r:0});if(!old||best.kg>(old.kg||0)||(best.kg===(old.kg||0)&&best.r>old.r))L.prList.push({e:it.e,kg:best.kg,r:best.r,txt:`${nf(best.kg,1)} kg × ${best.r}`})}else{best=Math.max(...ok.map(s=>+s.r||0));if(!old||(!old.kg&&best>old.r))L.prList.push({e:it.e,kg:0,r:best,txt:`${best}${x.t==='time'?' sn':' tekrar'}`})}});

copy:async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Yedek kopyalandı, Notlar\'a yapıştır')}catch(e){openSheet(`<h2>Yedek</h2><p class="sub">Metni seçip kopyala.</p><textarea readonly style="margin-top:10px;font-size:12px">${esc(JSON.stringify(S))}</textarea>`)}},
sheetImport:()=>openSheet(`<h2>Yedek yükle</h2><p class="sub">Daha önce kopyaladığın yedeği yapıştır. Bu profildeki veriler değişir.</p><form class="f" data-form="import" style="margin-top:12px"><textarea name="j" required placeholder="Yedek metni"></textarea><button class="btn pri lg">Yükle</button></form>`),
logout:()=>logout(),
delProf:()=>{if(!UI.confirm){UI.confirm=true;render();return}UI.confirm=false;R.profiles=R.profiles.filter(p=>p.id!==PID);delete R.data[PID];if(R.last===PID)R.last=null;save();logout();toast('Profil silindi')}};
const F={
signup:async f=>{const name=f.get('name').trim(),pin=f.get('pin');if(!name)return;if(pin&&!/^\d{4}$/.test(pin))return toast('PIN 4 rakam olmalı');const id=uid(),salt=uid();R.profiles.push({id,name,created:TODAY(),salt,pin:pin?await hashPin(pin,salt):null});R.data[id]=freshProfile(name);login(id)},
setpin:async f=>{const pin=f.get('pin');if(!/^\d{4}$/.test(pin))return toast('PIN 4 rakam olmalı');const p=R.profiles.find(x=>x.id===PID);p.pin=await hashPin(pin,p.salt);save();closeSheet();toast('PIN kaydedildi');render()},
newHab:f=>{const n=f.get('n').trim(),days=f.getAll('d').map(Number);if(!n)return;if(!days.length)return toast('En az bir gün seç');S.habits.push({id:uid(),k:'',n,ic:'check',kind:'check',c:'var(--acc)',days,created:TODAY()});save();closeSheet();toast('Alışkanlık eklendi');render()},
editHab:(f,el)=>{const h=S.habits.find(x=>x.id===el.dataset.id),days=f.getAll('d').map(Number);if(!days.length)return toast('En az bir gün seç');h.n=f.get('n').trim()||h.n;h.days=days;save();closeSheet();render()},
sleep:f=>{const bed=f.get('bed'),wake=f.get('wake');day(UI.date).sleep={bed,wake,q:+f.get('q'),min:diffHM(bed,wake)};save();toast('Uyku kaydedildi: '+hm(diffHM(bed,wake)));closeSheet();if(UI.view&&UI.view.id==='uyku')A.back();else render()},
weight:f=>{const kg=parseFloat(f.get('kg'));if(!(kg>0))return;const k=UI.date;S.weights=S.weights.filter(w=>w.k!==k);S.weights.push({k,kg});S.weights.sort((a,b)=>a.k.localeCompare(b.k));save();toast('Kilo kaydedildi');render()},
journal:f=>{day(UI.date).journal=f.get('t').trim();save();toast('Günlük kaydedildi');render()},
meal:f=>{day(UI.date).meals.push({id:uid(),n:f.get('n').trim(),k:+f.get('k')||0,p:+f.get('p')||0,t:nowHM()});save();toast('Öğün eklendi');render()},
work:f=>{day(UI.date).work.push({id:uid(),in:f.get('in'),out:f.get('out')||''});save();render()},
import:f=>{try{const o=JSON.parse(f.get('j'));if(!o||typeof o!=='object'||!o.days||!Array.isArray(o.habits))throw 0;o.name=S.name;S=R.data[PID]=mig(o);save();closeSheet();toast('Yedek yüklendi');render()}catch(e){toast('Bu metin geçerli bir yedek değil')}}};
Object.assign(A,EXT_A,EXT2_A,EXT3_A,EXT4_A,EXT5_A,EXT6_A,EXT7_A,EXT8_A,EXT9_A,EXT10_A,EXT11_A,{musc:t=>{UI.fm=UI.fm===t.dataset.v?'Tümü':t.dataset.v;render();const e=document.getElementById('exg');if(e&&UI.fm!=='Tümü')e.scrollIntoView({behavior:'smooth',block:'start'})}},{stats:()=>go({t:'stats'})});Object.assign(F,EXT_F,EXT2_F,EXT3_F,EXT6_F,EXT7_F,EXT9_F,EXT10_F);
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.dataset.act==='closeSheet'&&e.target!==t)return;A[t.dataset.act]&&A[t.dataset.act](t,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();F[f.dataset.form](new FormData(f),f)});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.goal){const v=parseFloat(t.value);if(v>0){S.goals[t.dataset.goal]=v;save();toast('Hedef güncellendi')}}
if(t.hasAttribute('data-dtog')||t.hasAttribute('data-ctog'))t.parentElement.classList.toggle('on',t.checked);
if(t.hasAttribute('data-stog'))t.form.querySelectorAll(`input[name="${t.name}"]`).forEach(r=>r.parentElement.classList.toggle('on',r.checked));
if(t.hasAttribute('data-photo')&&t.files&&t.files[0]){shrink(t.files[0]).then(src=>{const o={id:uid(),pid:PID,k:TODAY(),pose:UI.pose||'Ön',src};return photoPut(o).then(()=>{(PHOTOS=PHOTOS||[]).push(o);toast('Fotoğraf eklendi');render()})}).catch(()=>toast('Fotoğraf kaydedilemedi'))}
if(t.dataset.sf&&S.live){S.live.log[S.live.i][+t.dataset.s][t.dataset.sf]=t.value;save()}});
document.addEventListener('input',e=>{const t=e.target;if(t.hasAttribute('data-q')){UI.q=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-q]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
setInterval(()=>{if(!S)return;const now=Date.now(),p=S.pomo;
const hmNow=nowHM();if(UI.medT!==hmNow){UI.medT=hmNow;const dd=peek(TODAY());medToday(TODAY()).filter(x=>x.t===hmNow&&!dd.med[x.key]).forEach(x=>toast(`${x.m.n} zamanı (${x.t})`))}
if(p.end&&now>=p.end){if(p.mode==='focus'){day(TODAY()).pomo++;(S.focusLog=S.focusLog||[]).push({k:TODAY(),t:nowHM(),min:S.goals.pomo,task:p.task||''});ambStop(2);bell();S.pomo={mode:'break',end:now+Math.round(S.goals.pomo/5)*60000,rem:null,amb:p.amb,task:p.task};toast('Odak seansı bitti! Mola zamanı')}else{S.pomo={mode:'focus',end:null,rem:null,amb:p.amb,task:p.task};bell(true);toast('Mola bitti')}save();render();return}
const L=S.live;if(L&&!L.done){if(L.rest&&now>=L.rest.end){L.rest=null;try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}save();render();return}if(L.timer&&now>=L.timer.end){const it=L.items[L.i];L.timer=null;completeSet(it.r);return}
const q=id=>document.getElementById(id);if(q('pT'))q('pT').textContent=mmss((now-L.start)/1000);if(L.rest&&q('rT')){const rem=(L.rest.end-now)/1000;q('rT').textContent=mmss(rem);q('rR').style.setProperty('--p',100-rem/L.rest.len*100)}if(L.timer&&q('tT'))q('tT').textContent=mmss((L.timer.end-now)/1000)}
{const dk=document.getElementById('dkT');if(dk&&p.end)dk.textContent=mmss((p.end-now)/1000)}
const v=UI.view;if(v&&v.t==='tool'){const q=id=>document.getElementById(id);if(v.id==='kardiyo'&&S.cardioLive&&q('cT'))q('cT').textContent=mmss((now-S.cardioLive.start)/1000);if(v.id==='odak'&&p.end&&q('oT')){const dur=(p.mode==='focus'?S.goals.pomo:Math.round(S.goals.pomo/5))*60,rem=(p.end-now)/1000;q('oT').textContent=mmss(rem);q('oR').style.setProperty('--p',100-rem/dur*100)}if(v.id==='oruc'&&S.fast.active&&q('fT'))q('fT').textContent=hm((now-S.fast.active)/60000)}
const b=UI.br;if(b){const el=(now-b.start)/1000;if(el>=b.mins*60){UI.br=null;finishBreath(b.mins);return}const ph=Math.floor(el/4)%4,o=document.getElementById('orb');if(o){o.classList.toggle('grow',ph<2);document.getElementById('orbT').textContent=['Al','Tut','Ver','Tut'][ph];document.getElementById('brT').textContent=mmss(b.mins*60-el)}}},1000);
/* açılış */
if(!S&&R.last&&R.data[R.last]){const p=R.profiles.find(x=>x.id===R.last);if(p&&!p.pin)login(p.id);else if(p){UI.auth='pin';UI.pinFor=p.id}}
if(!S&&UI.auth==='welcome'&&R.profiles.length)UI.auth='login';
render();
(async()=>{try{const c=window.claude;if(!c||!c.use)return;const[db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;const r=db.collection('data/users/'+id).doc('ritim');const s=await r.get();const v=s&&(typeof s.data==='function'?s.data():s);if(v&&v.json&&v.ts>(R.ts||0)){R=Object.assign(freshRoot(),JSON.parse(v.json));try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}if(PID&&R.data[PID])S=R.data[PID]=mig(R.data[PID]);else if(PID){PID=null;S=null}}ref=r;if(R.ts&&!(v&&v.ts>=R.ts))r.set({json:JSON.stringify(R),ts:R.ts}).catch(()=>{});UI.sync='Bulutta eşitli';render()}catch(e){}})();
}
</script></body></html>
